name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Keep in sync with installers/install.sh (WINDBELL_NODE_VERSION / WINDBELL_PNPM_VERSION).
env:
  NODE_VERSION: "24.21.0"
  PNPM_VERSION: "12.9.1"

jobs:
  parity:
    name: script parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

  stage1:
    name: stage1 (${{ matrix.os }})
    needs: parity
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: stage1 (bash)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/all.sh

      - name: stage1 (powershell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/all.ps1
