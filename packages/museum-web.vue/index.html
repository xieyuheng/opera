<!doctype html>
<html lang="zh-CN" data-font="source-han-sans">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Museum</title>
    <script>
      let colorMode = "system"

      try {
        const storedColorMode = localStorage.getItem("museum.color-mode")
        if (
          storedColorMode === "system" ||
          storedColorMode === "light" ||
          storedColorMode === "dark"
        ) {
          colorMode = storedColorMode
        }
      } catch {
        // Ignore storage errors and fall back to the system color mode.
      }

      const dark =
        colorMode === "dark" ||
        (colorMode === "system" &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)

      document.documentElement.classList.toggle("dark", dark)
      document.documentElement.style.colorScheme = dark ? "dark" : "light"
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
