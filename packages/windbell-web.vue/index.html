<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>风铃 Windbell</title>
    <meta name="referrer" content="no-referrer" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: Canvas;
        color: CanvasText;
      }

      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: Canvas;
        color: CanvasText;
      }

      #app-loading-spinner {
        width: 2rem;
        height: 2rem;
        border: 2px solid color-mix(in oklab, currentColor 20%, transparent);
        border-top-color: currentColor;
        border-radius: 999px;
        animation: app-loading-spin 0.8s linear infinite;
      }

      @keyframes app-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      try {
        const url = new URL(window.location.href)
        const accessToken = url.searchParams.get("token")

        if (accessToken !== null) {
          try {
            localStorage.setItem("windbell.access-token", accessToken)
          } catch {
            // Keep going so the token is still removed from the URL.
          }

          url.searchParams.delete("token")

          if (url.pathname === "/" || url.pathname === "") {
            url.pathname = "/home"
          }

          window.history.replaceState(
            null,
            "",
            `${url.pathname}${url.search}${url.hash}`,
          )
        }
      } catch {
        // Ignore malformed URLs.
      }

      const colorMode = localStorage.getItem("windbell.color-mode") || "system"
      const dark =
        colorMode === "dark" ||
        (colorMode === "system" &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)

      document.documentElement.classList.toggle("dark", dark)
      document.documentElement.style.colorScheme = dark ? "dark" : "light"

      const locale = localStorage.getItem("windbell.locale")
      if (locale) {
        document.documentElement.lang = locale
      }

      const font = localStorage.getItem("windbell.font")
      document.documentElement.dataset.font =
        font === "system"
          ? "system"
          : font === "source-han-serif"
            ? "source-han-serif"
            : "unifont"
    </script>
  </head>
  <body>
    <div id="app">
      <div id="app-loading" aria-label="Loading Windbell">
        <div id="app-loading-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
